[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-guard"
version = "0.1.0"
description = "IAM for AI agents — permission and access control framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "ONI", email = "oni@agent-guard.dev"},
]
keywords = ["ai", "agents", "iam", "permissions", "security", "access-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "mypy>=1.0",
    "ruff>=0.5",
    "black>=24.0",
]
langchain = ["langchain>=0.3"]
crewai = ["crewai>=0.1"]

[project.scripts]
agent-guard = "agent_guard.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-xvs --cov=src --cov-report=term-missing"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
